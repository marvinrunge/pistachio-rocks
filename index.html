<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pistachio vs. Rocks</title>
  <meta name="title" content="Pistachio vs. Rocks">
  <meta name="description" content="Survive for as long as you can! Smash rocks, score points and climb the global leaderboard.">
  <meta property="og:title" content="Pistachio vs. Rocks" />
  <meta property="og:description" content="Survive for as long as you can! Smash rocks, score points and climb the global leaderboard." />
  <meta property="og:image" content="assets/og-image.png" />
  <meta property="og:type" content="website" />
  <meta name="keywords" content="Pistachio, Walnut, Rocks, Survive, 2D, Jump, Fast, Game, Browser Game, Fun, Play">
  <meta name="robots" content="index,follow">
  <meta name="language" content="en">
  <meta name="author" content="Marvin Runge">
  <meta name="theme-color" content="#222222">
  <style>
    @import "tailwindcss";
    html,
    body,
    #root {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      /* Prevents accidental text selection */
    }

    @keyframes fadeInOut {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }

      20% {
        opacity: 1;
        transform: scale(1.05);
      }

      80% {
        opacity: 1;
        transform: scale(1.05);
      }

      100% {
        opacity: 0;
        transform: scale(0.9);
      }
    }

    .animate-fade-in-out {
      animation: fadeInOut 4s ease-in-out forwards;
    }

    @keyframes warningPulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.9;
        transform: scale(1.03);
      }
    }

    .animate-warning-pulse {
      animation: warningPulse 1.5s ease-in-out infinite;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
      background-color: transparent;
    }

    ::-webkit-scrollbar-track {
      background-color: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.5);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: rgba(156, 163, 175, 0.8);
    }

    /* Firefox */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(156, 163, 175, 0.5) transparent;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
